[project]
name = "scrap-downloader"
version = "0.1.5"
description = "Self-hosted archival server for images and videos"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "gallery-dl>=1.32.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "nicegui>=3.13.0",
    "pillow>=12.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "yt-dlp>=2026.6.9",
]

[project.scripts]
scrap-downloader = "scrap_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrap_downloader"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
